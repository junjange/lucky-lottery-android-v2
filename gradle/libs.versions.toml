# coroutines
coroutines = "1.10.1"

# network
ktor = "3.0.3"
ktorfit = "2.7.1"
ktorfit-ksp-version = "2.7.1-2.0.4"
junit-ktx = "1.2.1"

# serialization
serialization = "1.6.3"
