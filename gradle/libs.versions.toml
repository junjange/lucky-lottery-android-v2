# libraries
ktx = "1.15.0"
lifecycle-runtime-ktx = "2.8.7"
material = "1.12.0"
lifecycle-extensions = "2.2.0"

## compose
compose = "1.10.1"
compose-ui = "1.9.3"
navigation = "2.9.5"

## test
junit = "4.13.2"
junit-ext = "1.2.1"
junit-espresso = "3.6.1"

## android-library
datastore = "1.1.3"
coil = "2.5.0"
koin = "4.0.1"
koin-compose = "4.0.0"
koin-compiler = "2.0.0-Beta1"
image-cropper = "4.5.0"

## kakao
kakao = "2.20.3"

## google
google-services = "4.4.2"
firebase-auth = "23.2.0"
firebase-messaging = "24.1.0"
firebase-bom = "33.10.0"
google-play-services-auth = "21.3.0"
google-admob-ads = "24.0.0"
appcompat = "1.7.0"
