[versions]
# app
compile-sdk = "36"
min-sdk = "24"
version-code = "13"
version-name = "3.2.0"

# plugins
kotlin-lang = "2.2.20"
android-gradle-plugin = "8.13.0"
kotlin-multiplatform = "2.2.20"
compose-multiplatform = "1.10.1"
navigation-compose-multiplatform = "2.9.2"
lifecycle-viewmodel-compose-multiplatform = "2.10.0"

# libraries
ktx = "1.15.0"
lifecycle-runtime-ktx = "2.8.7"
material = "1.12.0"

## compose
compose = "1.10.1"
compose-ui = "1.9.3"
navigation = "2.9.5"

## test
junit = "4.13.2"
junit-ext = "1.2.1"
junit-espresso = "3.6.1"

## android-library
koin = "4.0.1"
koin-compose = "4.0.0"
koin-compiler = "2.0.0-Beta1"
image-cropper = "4.5.0"

## google
google-admob-ads = "24.0.0"
compose-bom = "2025.02.00"
tesseract = "4.9.0"

# coroutines
coroutines = "1.10.1"

# network
ktor = "3.0.3"
ktorfit = "2.7.1"
ktorfit-ksp-version = "2.7.1-2.0.4"

# serialization
serialization = "1.6.3"
kotlinx-datetime = "0.4.0"

# room
room = "2.8.2"
sqlite = "2.6.1"
multiplatform-settings = "1.3.0"
coil3 = "3.0.4"

# workmanager
work = "2.9.0"
koin-workmanager = "4.0.0"

[libraries]
# default
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-lang" }
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "android-gradle-plugin" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }

# kotlin
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# compose
activity-compose = { group = "androidx.activity", name = "activity-compose" }
compose-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.7" }
compose-ui = { group = "androidx.compose.ui", name = "ui"}
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling-debug = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material = { group = "androidx.compose.material", name = "material", version = "1.7.8" }
activity-compose-versioned = { group = "androidx.activity", name = "activity-compose", version = "1.10.1" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.3.1" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin-lang" }

# test
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
junit-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "junit-espresso" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose-ui" }

# android-library
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin-compose" }
koin-compiler = { group = "io.insert-koin", name = "koin-ksp-compiler", version.ref = "koin-compiler" }
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin-compiler" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version = "3.3.6" }
image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "image-cropper" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }


# google
google-admob-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "google-admob-ads" }

# Network - Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Ktorfit
ktorfit-lib = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
ktorfit-ksp = { module = "de.jensklingenberg.ktorfit:ktorfit-ksp", version.ref = "ktorfit-ksp-version" }

# Compose Multiplatform
navigation-compose-multiplatform = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose-multiplatform" }
lifecycle-viewmodel-compose-multiplatform = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose-multiplatform" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin-compose" }
compose-multiplatform-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

# Zxing qr scanner
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version = "4.1.0" }
zxing-core = { group = "com.google.zxing", name = "core", version = "3.4.0" }

# Tesseract4Android
tesseract-android = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract" }

# room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# multiplatform key-value storage (SharedPreferences / NSUserDefaults)
multiplatform-settings = { group = "com.russhwolf", name = "multiplatform-settings", version.ref = "multiplatform-settings" }

# coil3 (multiplatform image loading)
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil3" }

# workmanager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
koin-androidx-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin-workmanager" }

[bundles]
android = ["core-ktx", "lifecycle-runtime-ktx", "material", "image-cropper", "zxing-android-embedded", "zxing-core"]
kotlin = ["coroutines-core", "kotlinx-serialization", "kotlinx-datetime"]
compose = ["activity-compose", "compose-lifecycle", "compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material", "compose-material3", "compose-navigation", "paging-compose"]
common = ["koin-android", "koin-core", "koin-androidx-compose"]
workmanager = ["work-runtime-ktx", "koin-androidx-workmanager"]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-lang = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-lang" }
ksp = { id = "com.google.devtools.ksp", version = "2.2.20-2.0.4" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin-lang" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-lang" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-lang" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-multiplatform" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
room = { id = "androidx.room", version.ref = "room" }
